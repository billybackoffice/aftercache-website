<style>
:root{
  --red:#e30d0d;--ink:#0b0b0a;--cream:#f2ead9;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--red)}
body{font-family:"DM Mono",monospace;color:var(--ink)}

.stage{position:relative;height:100svh;width:100%;background:var(--red);display:flex;flex-direction:column;justify-content:center}

/* grain / halftone overlay */
.grain{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(0,0,0,.55) 1px,transparent 1.3px);
  background-size:4px 4px;mix-blend-mode:multiply;z-index:5}

.badge{position:absolute;top:3.2vh;left:50%;transform:translateX(-50%);z-index:6;
  width:clamp(70px,9vw,110px);border-radius:14px;overflow:hidden;
  box-shadow:0 6px 22px rgba(11,11,10,.35);background:var(--cream)}
.badge img{display:block;width:100%;height:auto}

.type-wrap{position:relative;z-index:3;width:100%}

h1.line{
  font-family:Anton,"Arial Narrow",sans-serif;
  font-weight:400;
  text-transform:uppercase;
  font-size:clamp(64px,17vw,220px);
  line-height:.82;
  letter-spacing:-.01em;
  margin:0;white-space:nowrap;width:max-content;
}

.marquee{display:flex}
.marquee span{display:inline-block;padding-right:.28em}

.line-a{color:var(--ink);animation:scrollLeft 16s linear infinite}
